  <button id="playBtn" class="primary" onclick="togglePlay()">Ver cómo se arma</button>
  <span class="meta">Plano</span>
  <input id="slider" type="range" min="0" max="100" value="100" oninput="onSlide(this.value)" />
  <span class="meta">Armada</span>
  <span id="pct" class="meta">100%</span>
</footer>
<script>
  let rotX = 28, rotY = -26, fold = 100, playing = false, dragging = false, lx = 0, ly = 0;
  const box = document.getElementById('box');
  const pBottom = document.getElementById('pBottom');
  const pLeft = document.getElementById('pLeft');
  const pRight = document.getElementById('pRight');
  const pTop = document.getElementById('pTop');
  const pLid = document.getElementById('pLid');
  const pTuck = document.getElementById('pTuck');
  const slider = document.getElementById('slider');
  const pct = document.getElementById('pct');
  const playBtn = document.getElementById('playBtn');
  const clamp = v => Math.max(0, Math.min(1, v));

  function update() {
    const w = clamp(fold / 35) * 90;
    const l = clamp((fold - 54) / 30) * 90;
    const t = clamp((fold - 82) / 18) * 90;
    const sc = 0.68 + 0.32 * clamp(fold / 80);
    box.style.transform = 'scale(' + sc.toFixed(3) + ') rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg) translateZ(-24.5px)';
    pBottom.style.transform = 'rotateX(' + w + 'deg)';
    pLeft.style.transform = 'rotateY(' + w + 'deg)';
    pRight.style.transform = 'rotateY(' + (-w) + 'deg)';
    pTop.style.transform = 'rotateX(' + (-w) + 'deg)';
    pLid.style.transform = 'rotateX(' + (-l) + 'deg)';
    pTuck.style.transform = 'rotateX(' + (-t) + 'deg)';
    slider.value = Math.round(fold);
    pct.textContent = Math.round(fold) + '%';
  }
  function setCam(x, y, f) { playing = false; playBtn.textContent = 'Ver cómo se arma'; rotX = x; rotY = y; fold = f; update(); }
  function onSlide(v) { playing = false; playBtn.textContent = 'Reproducir armado'; fold = Number(v); update(); }
  function togglePlay() {
    if (playing) { playing = false; playBtn.textContent = 'Reproducir armado'; return; }
    if (fold >= 99) { fold = 0; rotX = 42; rotY = -22; }
    playing = true; playBtn.textContent = 'Pausar';
    let last = performance.now();
    function tick(now) {
      if (!playing) return;
      fold = Math.min(100, fold + ((now - last) / 1000) * 22);
      last = now; update();
      if (fold >= 100) { playing = false; playBtn.textContent = 'Ver cómo se arma'; return; }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  const stage = document.getElementById('stage');
  stage.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => {
    if (!dragging) return;
    rotY += (e.clientX - lx) * 0.48;
    rotX = Math.max(-88, Math.min(88, rotX - (e.clientY - ly) * 0.48));
    lx = e.clientX; ly = e.clientY; update();
  });
  stage.addEventListener('pointerup', () => dragging = false);
  update();
</script>
